  desc_pt: "Desenvolvimento de um simulador probabilístico para modelar <strong>ecossistemas de transações bancárias</strong> (Pix, cartões e transferências). Permite gerar milhões de registros com comportamento de consumo, sazonalidades e <strong>anomalias de fraude calibradas</strong>, garantindo testes analíticos seguros sob conformidade estrita com a <strong>LGPD e sigilo bancário</strong>."

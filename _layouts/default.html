<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v=2.0">
</head>
<body data-bs-spy="scroll" data-bs-target="#main-navbar" data-bs-root-margin="0px 0px -40%" data-bs-smooth-scroll="true" tabindex="0">

    <!-- Scroll Progress Indicator -->
    <div id="scroll-progress"></div>

    <!-- Sticky Minimal Navbar -->
    <nav id="main-navbar" class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand navbar-brand-tech" href="{{ '/' | relative_url }}">
                davi<span class="brand-dot">.</span>ribeiro()
            </a>
            <button class="navbar-toggler border-0 shadow-none text-muted" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="bi bi-list fs-2"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-2 align-items-lg-center">
                    <li class="nav-item"><a class="nav-link nav-link-tech" href="{{ '/' | relative_url }}#home">Início</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-tech" href="{{ '/' | relative_url }}#projetos">Projetos</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-tech" href="{{ '/' | relative_url }}#artigos">Artigos</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-tech" href="{{ '/' | relative_url }}#contato">Contato</a></li>
                    <li class="nav-item ms-lg-2">
                        <button class="btn-theme-toggle" id="theme-toggle" title="Alternar tema">
                            <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    {{ content }}

    <!-- Footer -->
    <footer class="footer-tech text-center">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-center gap-3 mb-3">
                <a href="https://www.linkedin.com/in/daviribeirods/" target="_blank" class="text-muted text-decoration-none hover-white"><i class="bi bi-linkedin me-1"></i> LinkedIn</a>
                <span class="text-muted">•</span>
                <a href="https://github.com/daviribeirods" target="_blank" class="text-muted text-decoration-none hover-white"><i class="bi bi-github me-1"></i> GitHub</a>
                <span class="text-muted">•</span>
                <a href="https://x.com/daviribeirods" target="_blank" class="text-muted text-decoration-none hover-white"><i class="bi bi-twitter-x me-1"></i> Twitter/X</a>
                <span class="text-muted">•</span>
                <a href="https://www.youtube.com/@daviribeirods" target="_blank" class="text-muted text-decoration-none hover-white"><i class="bi bi-youtube me-1"></i> YouTube</a>
                <span class="text-muted">•</span>
                <a href="https://medium.com/@davidatascientist" target="_blank" class="text-muted text-decoration-none hover-white"><i class="bi bi-medium me-1"></i> Medium</a>
            </div>
            <p class="mb-0 small text-subtle font-monospace">© 2026 Davi Ribeiro • Construído com foco em Data & Performance</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme & Scroll Script -->
    <script>
        // 1. Theme Management
        const btn = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-icon');
        const html = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-bs-theme', savedTheme);
        updateThemeIcon(savedTheme);

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                icon.className = 'bi bi-moon-stars-fill';
            } else {
                icon.className = 'bi bi-sun-fill';
            }
        }

        btn.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        // 2. Scroll Progress Bar
        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = (scrollTop / docHeight) * 100;
            const progressBar = document.getElementById('scroll-progress');
            if (progressBar) {
                progressBar.style.width = scrollPercent + '%';
            }
        });

        // 3. Smooth IntersectionObserver Scroll Reveal
        document.addEventListener('DOMContentLoaded', () => {
            const reveals = document.querySelectorAll('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, {
                threshold: 0.12,
                rootMargin: '0px 0px -40px 0px'
            });

            reveals.forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
